<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoC Pack Value Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════
           TOKENS & RESET
           ═══════════════════════════════════════════════ */
        :root {
            --bg: #0c0e12;
            --surface: #13161c;
            --surface-2: #191d25;
            --surface-3: #20252f;
            --border: #232833;
            --border-strong: #303747;
            --text: #e8eaee;
            --muted: #8b919d;
            --dim: #565c68;
            --gold: #e0b64f;
            --gold-soft: rgba(224, 182, 79, 0.12);
            --green: #3ddc97;
            --green-soft: rgba(61, 220, 151, 0.12);
            --red: #ff7070;
            --red-soft: rgba(255, 112, 112, 0.12);
            --blue: #6aa8ff;
            --purple: #c084fc;
            --radius: 10px;
            --radius-sm: 8px;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', 'Noto Sans Thai', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        button { font-family: inherit; }
        input { font-family: inherit; }

        /* ═══════════════════════════════════════════════
           HEADER
           ═══════════════════════════════════════════════ */
        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        header h1 {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            flex: 1;
        }

        header h1 .gem-dot { margin-right: 9px; width: 8px; height: 8px; vertical-align: 1px; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .info-toggle,
        .store-btn,
        .lang-toggle {
            height: 32px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            white-space: nowrap;
            padding: 0 12px;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }

        .info-toggle { width: 32px; padding: 0; border-radius: 999px; }

        .info-toggle:hover,
        .lang-toggle:hover {
            color: var(--text);
            border-color: var(--dim);
            background: var(--surface-3);
        }

        .store-btn { color: var(--green); border-color: rgba(61, 220, 151, 0.28); }

        .store-btn:hover {
            background: var(--green-soft);
            border-color: rgba(61, 220, 151, 0.5);
        }

        .info-toggle:active,
        .store-btn:active,
        .lang-toggle:active { transform: scale(0.95); }

        /* ═══════════════════════════════════════════════
           MAIN LAYOUT
           ═══════════════════════════════════════════════ */
        main {
            display: flex;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        .panel {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border-strong) transparent;
            min-width: 0;
        }

        .panel::-webkit-scrollbar { width: 5px; }
        .panel::-webkit-scrollbar-track { background: transparent; }
        .panel::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

        .panel-left {
            max-width: 44%;
            border-right: 1px solid var(--border);
            background: var(--surface);
        }

        .panel-right { max-width: 56%; }

        .section-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            margin-bottom: 14px;
            position: sticky;
            top: 0;
            z-index: 2;
            padding-bottom: 10px;
        }

        .panel-left .section-title { background: linear-gradient(180deg, var(--surface) 70%, transparent); }
        .panel-right .section-title { background: linear-gradient(180deg, var(--bg) 70%, transparent); }

        /* ═══════════════════════════════════════════════
           LEFT PANEL — YOUR PACK
           ═══════════════════════════════════════════════ */
        .pack-empty {
            color: var(--dim);
            text-align: center;
            padding: 48px 24px;
            font-size: 0.88rem;
            border: 1px dashed var(--border-strong);
            border-radius: var(--radius);
        }

        .pack-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 6px;
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }

        .pack-item-body { flex: 1; min-width: 0; }

        .pack-item-name {
            font-weight: 600;
            font-size: 0.88rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pack-item-detail {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .gem-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--gold);
            transform: rotate(45deg);
            border-radius: 1px;
            flex-shrink: 0;
        }

        .pack-item-remove {
            cursor: pointer;
            color: var(--dim);
            font-size: 0.9rem;
            width: 30px;
            height: 30px;
            border-radius: var(--radius-sm);
            border: none;
            background: none;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s, background 0.15s;
        }

        .pack-item-remove:hover { color: var(--red); background: var(--red-soft); }
        .pack-item-remove:active { transform: scale(0.9); }

        /* Pack total */
        .pack-total {
            margin-top: 12px;
            padding: 14px 16px;
            background: var(--surface-2);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            position: sticky;
            bottom: 0;
            z-index: 3;
        }

        .pack-total-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 3px 0;
        }

        .pack-total-row + .pack-total-row {
            margin-top: 6px;
            padding-top: 9px;
            border-top: 1px solid var(--border);
        }

        .pack-total-label { font-size: 0.8rem; color: var(--muted); }

        .pack-total-value {
            font-weight: 700;
            font-size: 1rem;
            color: var(--gold);
            font-variant-numeric: tabular-nums;
        }

        .pack-total-value-thb {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        /* ═══════════════════════════════════════════════
           RIGHT PANEL — ITEM CATALOG
           ═══════════════════════════════════════════════ */
        .category-header {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            padding: 14px 0 8px;
        }

        .category-header:first-child { padding-top: 0; }

        .catalog-item {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 54px;
            padding: 8px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 6px;
            transition: border-color 0.15s, background 0.15s;
        }

        .catalog-item:hover { border-color: var(--border-strong); }

        .catalog-item.active {
            border-color: rgba(224, 182, 79, 0.4);
            background: linear-gradient(0deg, var(--gold-soft), var(--gold-soft)), var(--surface);
        }

        .catalog-item-icon {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .catalog-item-icon img { width: 32px; height: 32px; object-fit: contain; }

        .catalog-item-info { flex: 1; min-width: 0; }

        .catalog-item-name {
            font-weight: 500;
            font-size: 0.88rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .catalog-item-gems {
            font-size: 0.76rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 1px;
        }

        .catalog-item-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .catalog-item-qty {
            width: 44px;
            text-align: center;
            font-weight: 700;
            font-size: 0.88rem;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 5px 0;
            outline: none;
            -moz-appearance: textfield;
            transition: border-color 0.15s;
        }

        .catalog-item-qty:hover { border-color: var(--border-strong); }
        .catalog-item-qty:focus { border-color: var(--gold); }
        .catalog-item-qty.zero { color: var(--dim); font-weight: 500; }

        .catalog-item-qty::-webkit-outer-spin-button,
        .catalog-item-qty::-webkit-inner-spin-button,
        #sale-price::-webkit-outer-spin-button,
        #sale-price::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #sale-price { -moz-appearance: textfield; }

        .btn {
            width: 30px;
            height: 30px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s, background 0.15s, border-color 0.15s;
        }

        .btn:active { transform: scale(0.9); }

        .btn-add {
            background: var(--gold-soft);
            border-color: rgba(224, 182, 79, 0.35);
            color: var(--gold);
        }

        .btn-add:hover {
            background: rgba(224, 182, 79, 0.22);
            border-color: var(--gold);
        }

        .btn-sub {
            background: var(--surface-2);
            color: var(--muted);
        }

        .btn-sub:hover { color: var(--text); border-color: var(--dim); }

        .btn-sub.disabled { opacity: 0.3; pointer-events: none; }

        /* Focus visibility */
        .btn:focus-visible,
        .btn-clear:focus-visible,
        .info-toggle:focus-visible,
        .store-btn:focus-visible,
        .lang-toggle:focus-visible,
        .info-close:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        .pack-item-remove:focus-visible {
            outline: 2px solid var(--red);
            outline-offset: 2px;
        }

        /* ═══════════════════════════════════════════════
           FOOTER — PRICE + LIVE RESULT
           ═══════════════════════════════════════════════ */
        footer {
            padding: 14px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            z-index: 10;
        }

        .footer-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            max-width: 1040px;
            margin: 0 auto;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--muted);
            white-space: nowrap;
        }

        .input-wrap { position: relative; display: flex; align-items: center; }

        .input-wrap input {
            padding: 9px 48px 9px 14px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            width: 150px;
            transition: border-color 0.15s;
        }

        .input-wrap input::placeholder { color: var(--dim); font-weight: 400; }
        .input-wrap input:focus { outline: none; border-color: var(--gold); }

        .input-suffix {
            position: absolute;
            right: 12px;
            font-size: 0.78rem;
            color: var(--dim);
            font-weight: 500;
            pointer-events: none;
        }

        .btn-clear {
            padding: 9px 16px;
            background: none;
            color: var(--muted);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: color 0.15s, border-color 0.15s;
        }

        .btn-clear:hover { color: var(--text); border-color: var(--dim); }
        .btn-clear:active { transform: scale(0.97); }

        /* Live result — inline on the same row */
        .result {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 20px;
            min-width: 0;
        }

        .result-hint {
            font-size: 0.82rem;
            color: var(--dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-card {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            animation: fadeUp 0.25s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-stat, .result-savings { display: flex; flex-direction: column; gap: 1px; }
        .result-stat-label { font-size: 0.68rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
        .result-stat-value { font-weight: 700; font-size: 0.95rem; font-variant-numeric: tabular-nums; }

        .result-savings-pct {
            font-weight: 700;
            font-size: 1.55rem;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .result-savings-pct.positive { color: var(--green); }
        .result-savings-pct.negative { color: var(--red); }

        .result-savings-amount { font-size: 0.74rem; color: var(--muted); white-space: nowrap; }

        .deal-tag {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .deal-mythic { background: rgba(192, 132, 252, 0.14); color: var(--purple); border: 1px solid rgba(192, 132, 252, 0.4); }
        .deal-legendary { background: var(--gold-soft); color: var(--gold); border: 1px solid rgba(224, 182, 79, 0.45); }
        .deal-great { background: var(--green-soft); color: var(--green); border: 1px solid rgba(61, 220, 151, 0.4); }
        .deal-good { background: rgba(134, 239, 172, 0.1); color: #86efac; border: 1px solid rgba(134, 239, 172, 0.3); }
        .deal-okay { background: rgba(253, 224, 71, 0.1); color: #fde047; border: 1px solid rgba(253, 224, 71, 0.3); }
        .deal-bad { background: var(--red-soft); color: var(--red); border: 1px solid rgba(255, 112, 112, 0.35); }

        .deal-meter {
            width: 120px;
            height: 6px;
            background: var(--bg);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .deal-meter-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 0.5s cubic-bezier(0.34, 1.3, 0.64, 1);
        }

        .deal-meter-fill.mythic { background: var(--purple); }
        .deal-meter-fill.legendary { background: var(--gold); }
        .deal-meter-fill.positive { background: var(--green); }
        .deal-meter-fill.negative { background: var(--red); }

        /* ═══════════════════════════════════════════════
           INFO MODAL
           ═══════════════════════════════════════════════ */
        .info-modal { position: fixed; inset: 0; z-index: 100; display: none; }
        .info-modal.open { display: block; }

        .info-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(5, 7, 10, 0.7);
            backdrop-filter: blur(4px);
        }

        .info-dialog {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(440px, calc(100vw - 28px));
            max-height: min(660px, calc(100svh - 28px));
            overflow-y: auto;
            padding: 22px;
            background: var(--surface-2);
            border: 1px solid var(--border-strong);
            border-radius: 14px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        .info-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--muted);
            cursor: pointer;
            font-size: 1.05rem;
            transition: color 0.15s, border-color 0.15s;
        }

        .info-close:hover { color: var(--text); border-color: var(--dim); }

        .info-kicker {
            margin-bottom: 6px;
            color: var(--blue);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .info-dialog h2 {
            max-width: calc(100% - 40px);
            margin-bottom: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.25;
        }

        .info-steps {
            display: grid;
            gap: 8px;
            margin: 0 0 14px;
            padding: 0;
            list-style: none;
            counter-reset: info-step;
        }

        .info-steps li {
            counter-increment: info-step;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            line-height: 1.4;
        }

        .info-steps li::before {
            content: counter(info-step);
            width: 22px;
            height: 22px;
            flex: 0 0 auto;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(106, 168, 255, 0.12);
            color: var(--blue);
            font-weight: 700;
            font-size: 0.74rem;
        }

        .info-result-note {
            margin-bottom: 18px;
            color: var(--muted);
            font-size: 0.84rem;
            line-height: 1.5;
        }

        .gem-rate-title {
            margin-bottom: 10px;
            color: var(--gold);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .value-rate-title { margin-top: 18px; }

        .gem-rate-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
        }

        .gem-rate-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 8px;
            min-width: 0;
            padding: 8px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--muted);
            font-size: 0.82rem;
        }

        .gem-rate-row span,
        .gem-rate-row strong { white-space: nowrap; }

        .gem-rate-equals { color: var(--dim); font-weight: 700; }

        .gem-rate-row strong {
            color: var(--text);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .value-rate-list { display: grid; gap: 6px; }

        .value-rate-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }

        .value-rate-min {
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* ═══════════════════════════════════════════════
           RESPONSIVE
           ═══════════════════════════════════════════════ */
        @media (max-width: 700px) {
            header { padding: 10px 14px; }
            header h1 { font-size: 0.92rem; }

            main { flex-direction: column; min-height: 0; }

            .panel { padding: 14px; }

            .panel-left, .panel-right { max-width: 100%; min-height: 0; }

            .panel-left {
                flex: 0 0 auto;
                max-height: 32svh;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .panel-right { flex: 1 1 auto; }

            .pack-empty { padding: 28px 16px; }

            .pack-total { position: relative; bottom: auto; margin-top: 8px; padding: 11px 13px; }

            .catalog-item { min-height: 60px; padding: 10px 12px; }
            .catalog-item-controls { gap: 6px; }

            .btn { width: 36px; height: 36px; }
            .catalog-item-qty { width: 46px; min-height: 36px; }

            footer { padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); flex: 0 0 auto; }

            .footer-row { gap: 10px; }

            .input-group { flex: 1 1 100%; justify-content: space-between; }

<body>
    <header>
        <h1><span class="gem-dot" aria-hidden="true"></span><span id="title">CoC Pack Calculator</span></h1>
        <div class="header-actions">
            <button class="info-toggle" id="info-toggle" type="button" aria-haspopup="dialog" aria-expanded="false">i</button>

    <main>

    <script>
        /* ═══════════════════════════════════
           I18N
           ═══════════════════════════════════ */
        const i18n = {
            th: {
                title: 'คำนวณความคุ้ม',

                infoTitle: 'วิธีคำนวณความคุ้ม',
                infoSteps: [
                    'เพิ่มไอเทมที่อยู่ในแพ็ค',

                ],
                infoResultNote: 'ผลลัพธ์จะแสดง % ส่วนลด และจำนวนเงินที่ประหยัดได้เทียบกับการซื้ออัญมณีโดยตรง',
                gemRateTitle: 'อัตราราคาอัญมณีล่าสุด',
                valueRateTitle: 'เกณฑ์ระดับความคุ้ม',
                belowTen: 'ต่ำกว่า 10%',
                langBtn: 'EN',
                categories: { books: 'ตำรา', potions: 'น้ำยา', runes: 'รูน', ores: 'แร่', other: 'อื่นๆ' },
            },
            en: {
                title: 'Pack Value',
                yourPack: 'Your Pack',
                itemCatalog: 'Item Catalog',
                totalGems: 'Total Gems',
                originalPrice: 'Original Price',
                salePrice: 'Pack Sale Price',
                clearAll: 'Clear All',
                emptyPack: 'Select items from the catalog to build your pack',
                gems: 'gems',
                original: 'Original',
                sale: 'Sale',
                youSave: 'You save',
                youOverpay: 'You overpay',
                mythic: 'Mythic',
                legendary: 'Legendary',
                great: 'Great',
                good: 'Good',
                okay: 'Okay',
                bad: 'Bad Deal',
                hintNoItems: 'Add items to see the result',
                hintNoPrice: 'Enter the sale price to see the result',
                increase: 'Increase',
                decrease: 'Decrease',
                remove: 'Remove',
                quantity: 'Quantity',
                infoLabel: 'More information',
                infoClose: 'Close',
                infoKicker: 'Guide',
                infoTitle: 'How the calculator works',
                infoSteps: [
                    'Add items from the pack',
                    'Type the store price',
                    'The result updates instantly',
                ],
                infoResultNote: 'The result shows the discount percentage and how much THB you save compared with buying gems directly.',
                gemRateTitle: 'Latest gem price rate',
                valueRateTitle: 'Value rating scale',
                belowTen: 'Below 10%',
                langBtn: 'TH',
                categories: { books: 'Books', potions: 'Potions', runes: 'Runes', ores: 'Ores', other: 'Other' },
            },
        };

        let lang = 'th';
        function t(key) { return i18n[lang][key]; }

        /* ═══════════════════════════════════
           DATA
           ═══════════════════════════════════ */
        const items = [
            { en: "Book of Everything", th: "ตำราสรรพสิ่ง", gems: 925, cat: "books", img: "bookofeverything.webp" },
            { en: "Book of Building", th: "ตำราสิ่งก่อสร้าง", gems: 925, cat: "books", img: "bookofbuilding.webp" },
            { en: "Book of Fighting", th: "ตำราการต่อสู้", gems: 925, cat: "books", img: "bookoffighting.webp" },
            { en: "Book of Spell", th: "ตำราอาคม", gems: 925, cat: "books", img: "bookofspells.webp" },
            { en: "Book of Hero", th: "ตำราผู้กล้า", gems: 500, cat: "books", img: "bookofheroes.webp" },
            { en: "Builder Potion", th: "น้ำยาช่างก่อสร้าง", gems: 285, cat: "potions", img: "builderpotion.webp" },
            { en: "Research Potion", th: "น้ำยาวิจัย", gems: 120, cat: "potions", img: "researchpotion.webp" },
            { en: "Hero Potion", th: "น้ำยาผู้กล้า", gems: 300, cat: "potions", img: "heropotion.webp" },
            { en: "Power Potion", th: "น้ำยาพลัง", gems: 300, cat: "potions", img: "powerpotion.webp" },
            { en: "Resource Potion", th: "น้ำยาทรัพยากร", gems: 500, cat: "potions", img: "resourcepotion.webp" },
            { en: "Super Potion", th: "ซูเปอร์น้ำยา", gems: 300, cat: "potions", img: "superpotion.webp" },
            { en: "Clock Potion", th: "น้ำยาหอนาฬิกา", gems: 75, cat: "potions", img: "clocktowerpotion.webp" },
            { en: "Rune of Dark Elixir", th: "รูนน้ำอมฤตมืด", gems: 2000, cat: "runes", img: "runeofdarkelixir.webp" },
            { en: "Rune of Gold", th: "รูนทองคำ", gems: 1000, cat: "runes", img: "runeofgold.webp" },
            { en: "Rune of Elixir", th: "รูนน้ำอมฤต", gems: 1000, cat: "runes", img: "runeofelixir.webp" },
            { en: "Wall Ring", th: "แหวนกำแพง", gems: 35, cat: "other", img: "wallring.webp" },
            { en: "Shovel", th: "พลั่วแห่งสิ่งกีดขวาง", gems: 500, cat: "other", img: "shovelofobstacles.webp" },
            { en: "Shiny Ore", th: "แร่วิบวับ", gems: 1, cat: "ores", img: "shiny-ore.webp" },
            { en: "Glowy Ore", th: "แร่เรืองรอง", gems: 5, cat: "ores", img: "glowy-ore.webp" },
            { en: "Starry Ore", th: "แร่ประกายดาว", gems: 35, cat: "ores", img: "starry-ore.webp" },
        ];

        function itemName(item) { return item[lang]; }

        const categories = [
            { key: "books" },
            { key: "potions" },
            { key: "runes" },
            { key: "ores" },
            { key: "other" },
        ];

        const gemPacks = [
            { gems: 80, thb: 15 },
            { gems: 500, thb: 69 },
            { gems: 1200, thb: 149 },
            { gems: 1850, thb: 219 },
            { gems: 2500, thb: 299 },
            { gems: 6500, thb: 729 },
            { gems: 14000, thb: 1450 },
            { gems: 30000, thb: 2990 },
        ];

        const valueLevels = [
            { key: 'mythic', min: 80, dealClass: 'deal-mythic', meterClass: 'mythic' },
            { key: 'legendary', min: 60, dealClass: 'deal-legendary', meterClass: 'legendary' },
            { key: 'great', min: 40, dealClass: 'deal-great', meterClass: 'positive' },
            { key: 'good', min: 25, dealClass: 'deal-good', meterClass: 'positive' },
            { key: 'okay', min: 10, dealClass: 'deal-okay', meterClass: 'positive' },
            { key: 'bad', min: null, dealClass: 'deal-bad', meterClass: 'negative' },
        ];

        /* ═══════════════════════════════════
           STATE
           ═══════════════════════════════════ */
        const pack = new Array(items.length).fill(0);

        /* ═══════════════════════════════════
           GEM → THB CONVERSION (DP)
           ═══════════════════════════════════ */
        const dpCache = new Map();

        function gemsToTHB(totalGems) {
            if (totalGems <= 0) return 0;
            if (dpCache.has(totalGems)) return dpCache.get(totalGems);

            let baseCost = 0;
            let remaining = totalGems;

            const largestPack = gemPacks[gemPacks.length - 1];
            if (remaining >= largestPack.gems) {
                const count = Math.floor(remaining / largestPack.gems);
                baseCost = count * largestPack.thb;
                remaining = remaining % largestPack.gems;
            }

            if (remaining === 0) { dpCache.set(totalGems, baseCost); return baseCost; }

            const dp = new Array(remaining + 1).fill(Infinity);
            dp[0] = 0;

            for (let i = 1; i <= remaining; i++) {
                for (const p of gemPacks) {
                    const prev = Math.max(0, i - p.gems);
                    const cost = dp[prev] + p.thb;
                    if (cost < dp[i]) dp[i] = cost;
                }
            }

            const result = baseCost + dp[remaining];
            dpCache.set(totalGems, result);
            return result;
        }

        /* ═══════════════════════════════════
           RENDER
           ═══════════════════════════════════ */
        function getTotalGems() {
            return pack.reduce((sum, qty, i) => sum + qty * items[i].gems, 0);
        }

        function getValueLevel(pct) {
            return valueLevels.find(level => level.min === null || pct >= level.min);
        }

        function valueLevelText(level) {
            return level.min === null ? t('belowTen') : `${level.min}%+`;
        }

        function renderUI() {
            document.getElementById('title').textContent = t('title');
            document.getElementById('pack-title').textContent = t('yourPack');
            document.getElementById('catalog-title').textContent = t('itemCatalog');
            document.getElementById('label-total-gems').textContent = t('totalGems');
            document.getElementById('label-original-price').textContent = t('originalPrice');
            document.getElementById('label-sale-price').textContent = t('salePrice');
            document.getElementById('btn-clear').textContent = t('clearAll');
            document.getElementById('lang-toggle').textContent = t('langBtn');
            const storeBtn = document.getElementById('store-btn');
            storeBtn.textContent = lang === 'th' ? 'สโตร์' : 'STORE';
            storeBtn.href = lang === 'th'
                ? 'https://store.supercell.com/th/clashofclans?boost=KLAWKLA'
                : 'https://store.supercell.com/clashofclans?boost=KLAWKLA';
            renderInfoContent();
        }

        function renderInfoContent() {
            const infoToggle = document.getElementById('info-toggle');
            const infoClose = document.getElementById('info-close');
            infoToggle.setAttribute('aria-label', t('infoLabel'));
            infoToggle.title = t('infoLabel');
            infoClose.setAttribute('aria-label', t('infoClose'));
            document.getElementById('info-kicker').textContent = t('infoKicker');
            document.getElementById('info-title').textContent = t('infoTitle');
            document.getElementById('info-steps').innerHTML = t('infoSteps')
                .map(step => `<li>${step}</li>`)
                .join('');
            document.getElementById('info-result-note').textContent = t('infoResultNote');
            document.getElementById('gem-rate-title').textContent = t('gemRateTitle');
            document.getElementById('gem-rate-list').innerHTML = gemPacks
                .map(packRate => `<div class="gem-rate-row"><span>${packRate.gems.toLocaleString()} <span aria-hidden="true">💎</span></span><span class="gem-rate-equals"> = </span><strong>${packRate.thb.toLocaleString()} THB</strong></div>`)
                .join('');
            document.getElementById('value-rate-title').textContent = t('valueRateTitle');
            document.getElementById('value-rate-list').innerHTML = valueLevels
                .map(level => `<div class="value-rate-row"><span class="value-rate-min">${valueLevelText(level)}</span><span class="deal-tag ${level.dealClass}">${t(level.key)}</span></div>`)
                .join('');
        }

        function setInfoModal(open) {
            const modal = document.getElementById('info-modal');
            const toggle = document.getElementById('info-toggle');
            modal.classList.toggle('open', open);
            modal.setAttribute('aria-hidden', String(!open));
            toggle.setAttribute('aria-expanded', String(open));
            if (open) {
                document.getElementById('info-close').focus();
            } else {
                toggle.focus();
            }
        }

        function render() {
            renderUI();
            renderPack();
            renderCatalog();
            updateResult();
        }

        function renderPack() {
            const listEl = document.getElementById('pack-list');
            const totalEl = document.getElementById('pack-total');
            const hasItems = pack.some(q => q > 0);

            if (!hasItems) {
                listEl.innerHTML = `<div class="pack-empty">${t('emptyPack')}</div>`;
                totalEl.style.display = 'none';
                return;
            }

            let html = '';
            let totalGemsVal = 0;

            for (let i = 0; i < items.length; i++) {
                if (pack[i] > 0) {
                    const itemGems = items[i].gems * pack[i];
                    totalGemsVal += itemGems;
                    html += `<div class="pack-item">
                        <div class="catalog-item-icon"><img src="images/${items[i].img}" alt="" aria-hidden="true" loading="lazy"></div>
                        <div class="pack-item-body">
                            <div class="pack-item-name">${itemName(items[i])} &times;${pack[i]}</div>
                            <div class="pack-item-detail"><span class="gem-dot"></span>${itemGems.toLocaleString()} ${t('gems')}</div>
                        </div>
                        <button class="pack-item-remove" data-remove="${i}" aria-label="${t('remove')} ${itemName(items[i])}">&times;</button>
                    </div>`;
                }
            }

            listEl.innerHTML = html;
            totalEl.style.display = 'block';
            document.getElementById('total-gems').textContent = totalGemsVal.toLocaleString();
            document.getElementById('total-thb').textContent = gemsToTHB(totalGemsVal).toLocaleString() + ' THB';
        }

        function renderCatalog() {
            const catalogEl = document.getElementById('catalog');
            let html = '';

            for (const cat of categories) {
                html += `<div class="category-header">${t('categories')[cat.key]}</div>`;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].cat !== cat.key) continue;
                    const qty = pack[i];
                    const isActive = qty > 0;
                    html += `<div class="catalog-item${isActive ? ' active' : ''}">
                        <div class="catalog-item-icon"><img src="images/${items[i].img}" alt="" aria-hidden="true" loading="lazy"></div>
                        <div class="catalog-item-info">
                            <div class="catalog-item-name">${itemName(items[i])}</div>
                            <div class="catalog-item-gems"><span class="gem-dot"></span>${items[i].gems} ${t('gems')}</div>
                        </div>
                        <div class="catalog-item-controls">
                            <button class="btn btn-sub${qty === 0 ? ' disabled' : ''}" data-sub="${i}" aria-label="${t('decrease')} ${itemName(items[i])}">&minus;</button>
                            <input type="number" class="catalog-item-qty${qty === 0 ? ' zero' : ''}" value="${qty}" min="0" inputmode="numeric" data-qty="${i}" aria-label="${t('quantity')} ${itemName(items[i])}">
                            <button class="btn btn-add" data-add="${i}" aria-label="${t('increase')} ${itemName(items[i])}">+</button>
                        </div>
                    </div>`;
                }
            }

            catalogEl.innerHTML = html;
        }

        /* ═══════════════════════════════════
           LIVE RESULT
           ═══════════════════════════════════ */
        function updateResult() {
            const resultEl = document.getElementById('result');
            const totalGems = getTotalGems();

            if (totalGems === 0) {
                resultEl.innerHTML = `<span class="result-hint">${t('hintNoItems')}</span>`;
                return;
            }

            const rawPrice = document.getElementById('sale-price').value;
            const salePrice = parseFloat(rawPrice);
            if (rawPrice === '' || isNaN(salePrice) || salePrice < 0) {
                resultEl.innerHTML = `<span class="result-hint">${t('hintNoPrice')}</span>`;
                return;
            }

            const originalTHB = gemsToTHB(totalGems);
            const savings = originalTHB - salePrice;
            const pct = originalTHB > 0 ? ((savings / originalTHB) * 100) : 0;
            const pctRounded = Number(pct.toFixed(1));
            const pctAbs = Math.abs(pctRounded).toFixed(1);
            const isPositive = savings >= 0;

            const dealLevel = getValueLevel(pctRounded);
            const meterWidth = Math.min(100, Math.max(0, pctRounded));
            const saveText = isPositive ? t('youSave') : t('youOverpay');

            resultEl.innerHTML = `<div class="result-card">
                <div class="result-stat">
                    <span class="result-stat-label">${t('original')}</span>
                    <span class="result-stat-value">${originalTHB.toLocaleString()} THB</span>
                </div>
                <div class="result-stat">
                    <span class="result-stat-label">${t('sale')}</span>
                    <span class="result-stat-value">${salePrice.toLocaleString()} THB</span>
                </div>
                <div class="result-savings">
                    <span class="result-savings-pct ${isPositive ? 'positive' : 'negative'}">${isPositive ? '' : '-'}${pctAbs}%</span>
                    <span class="result-savings-amount">${saveText} ${Math.abs(savings).toLocaleString()} THB</span>
                </div>
                <div class="deal-meter">
                    <div class="deal-meter-fill ${dealLevel.meterClass}" style="width:${meterWidth}%"></div>
                </div>
                <span class="deal-tag ${dealLevel.dealClass}">${t(dealLevel.key)}</span>
            </div>`;
        }

        /* ═══════════════════════════════════
           EVENT HANDLERS
           ═══════════════════════════════════ */
        document.getElementById('catalog').addEventListener('click', (e) => {
            const addBtn = e.target.closest('[data-add]');
            const subBtn = e.target.closest('[data-sub]');
            if (addBtn) {
                pack[parseInt(addBtn.dataset.add)]++;
                render();
            } else if (subBtn) {
                const idx = parseInt(subBtn.dataset.sub);
                pack[idx] = Math.max(0, pack[idx] - 1);
                render();
            }
        });

        document.getElementById('catalog').addEventListener('input', (e) => {
            const qtyInput = e.target.closest('[data-qty]');
            if (!qtyInput) return;
            const idx = parseInt(qtyInput.dataset.qty);
            const val = parseInt(qtyInput.value);
            pack[idx] = isNaN(val) || val < 0 ? 0 : val;
            renderPack();
            updateResult();
            // Update active state and minus button without losing focus
            const item = qtyInput.closest('.catalog-item');
            item.classList.toggle('active', pack[idx] > 0);
            qtyInput.classList.toggle('zero', pack[idx] === 0);
            const subBtn = item.querySelector('[data-sub]');
            subBtn.classList.toggle('disabled', pack[idx] === 0);
        });

        document.getElementById('pack-list').addEventListener('click', (e) => {
            const removeBtn = e.target.closest('[data-remove]');
            if (removeBtn) {
                pack[parseInt(removeBtn.dataset.remove)] = 0;
                render();
            }
        });

        document.getElementById('info-toggle').addEventListener('click', () => {
            setInfoModal(true);
        });

        document.getElementById('info-modal').addEventListener('click', (e) => {
            if (e.target.closest('[data-info-close]')) {
                setInfoModal(false);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('info-modal').classList.contains('open')) {
                setInfoModal(false);
            }
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            pack.fill(0);
            document.getElementById('sale-price').value = '';
            render();
        });

        document.getElementById('sale-price').addEventListener('input', updateResult);

        document.getElementById('lang-toggle').addEventListener('click', () => {
            lang = lang === 'th' ? 'en' : 'th';
            render();
        });

        /* Init */
        render();
    </script>
</body>
</html>
