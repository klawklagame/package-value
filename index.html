        /* ═══════════════════════════════════════════════
           PACK VALUE — layout on top of the KLAWKLA Tools system (kk/)
           ═══════════════════════════════════════════════ */
        html, body { height: 100%; }
        body { overflow: hidden; }

        /* Two panes: your pack | item catalog */
        .pv-main {
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
            grid-template-rows: minmax(0, 1fr);
        }
        .pv-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
        .pv-pack { background: var(--surface); border-right: 1px solid var(--line); }
        .pv-pane-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: var(--space-3);
            padding: var(--space-4) var(--space-5) var(--space-2);
        }
        .pv-pane-title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 24px; color: var(--ink); }
        .pv-count { font-family: var(--font-display); font-weight: 700; font-size: 13px; line-height: 18px; letter-spacing: .04em; color: var(--ink-subtle); }
        .pv-pane-body {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 0 var(--space-5) var(--space-5);
            scrollbar-width: thin;
            scrollbar-color: var(--line-strong) transparent;
        }
        .pv-pack .kk-empty { padding: var(--space-6) var(--space-4); }
        .pv-pack .kk-empty-hint { margin: 0; }
        .pv-group { display: flex; flex-direction: column; }
        .pv-group + .pv-group { margin-top: var(--space-2); }
        .pv-group:first-child .kk-row-group { padding-top: 0; }

        /* Pack totals */
        .pv-totals {
            display: grid;
            gap: var(--space-2);
            padding: var(--space-3) var(--space-5) var(--space-4);
            border-top: 1px solid var(--line);
        }
        .pv-total { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
        .pv-total .kk-amount { font-size: 22px; line-height: 30px; }

        /* Bottom bar: price · clear · verdict */
        .pv-bar {
            display: grid;
            grid-template-columns: 220px auto minmax(0, 1fr);
            align-items: end;
            gap: var(--space-3) var(--space-5);
        }
        .pv-result { align-self: center; min-width: 0; }
        .pv-hint { margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-subtle); text-align: right; }

        /* Info dialog tables */
        .pv-info-block { display: flex; flex-direction: column; gap: var(--space-2); }
        .pv-rates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
        .pv-rate, .pv-tier {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-2);
            min-height: 40px;
            padding: var(--space-1) var(--space-3);
            background: var(--raised);
            border-radius: var(--radius-md);
        }
        .pv-rate .kk-amount { font-size: 15px; }
        .pv-rate strong, .pv-tier-min { font-family: var(--font-display); font-weight: 700; font-size: 15px; white-space: nowrap; }
        .pv-rate strong { color: var(--ink); }
        .pv-tier-min { color: var(--ink-muted); }
        .pv-tiers { display: grid; gap: var(--space-2); }

        @media (max-width: 719px) {
            .pv-main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
            .pv-pack { max-height: 32svh; border-right: 0; border-bottom: 1px solid var(--line); }
            .pv-pack .kk-row { min-height: 52px; padding-block: var(--space-2); }
            .pv-pane-head { padding: var(--space-3) var(--space-4) var(--space-1); }
            .pv-pane-body { padding: 0 var(--space-4) var(--space-3); }
            .pv-pack .kk-empty { padding: var(--space-4); }
            .pv-totals { grid-template-columns: 1fr 1fr; padding: var(--space-2) var(--space-4) var(--space-3); }
            .pv-total { flex-direction: column; align-items: flex-start; gap: 0; }
            .pv-total .kk-amount { font-size: 20px; line-height: 28px; }
            .pv-bar { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "price clear" "result result"; }
            .pv-price { grid-area: price; }
            #btn-clear { grid-area: clear; }
            .pv-result { grid-area: result; }
            .pv-hint { text-align: left; }
            .pv-result .kk-deal { grid-template-areas: "pct tag" "pct note"; }
            .pv-result .kk-deal-pct { font-size: 28px; line-height: 32px; }
            .pv-result .kk-meter { display: none; }
        }
        @media (max-width: 479px) {
            .pv-footer { display: none; }
            .pv-rates { grid-template-columns: minmax(0, 1fr); }
        }
    </style>

        const pack = new Array(items.length).fill(0);

        /* ═══════════════════════════════════
           GEM → THB CONVERSION (DP)
           ═══════════════════════════════════ */
        const dpCache = new Map();

        function gemsToTHB(totalGems) {
            if (totalGems <= 0) return 0;
            if (dpCache.has(totalGems)) return dpCache.get(totalGems);

            let baseCost = 0;
            let remaining = totalGems;

            const largestPack = gemPacks[gemPacks.length - 1];
            if (remaining >= largestPack.gems) {
                const count = Math.floor(remaining / largestPack.gems);
                baseCost = count * largestPack.thb;
                remaining = remaining % largestPack.gems;
            }

            if (remaining === 0) { dpCache.set(totalGems, baseCost); return baseCost; }

            const dp = new Array(remaining + 1).fill(Infinity);
            dp[0] = 0;

            for (let i = 1; i <= remaining; i++) {
                for (const p of gemPacks) {
                    const prev = Math.max(0, i - p.gems);
                    const cost = dp[prev] + p.thb;
                    if (cost < dp[i]) dp[i] = cost;
                }
            }

            const result = baseCost + dp[remaining];
            dpCache.set(totalGems, result);
            return result;
        }

        const fmt = n => n.toLocaleString('en-US', { maximumFractionDigits: 2 });

        function gemAmount(n, extraClass = '') {
            return `<span class="kk-amount kk-amount--gem ${extraClass}">${fmt(n)}<span class="kk-sr"> ${t('gems')}</span><svg class="kk-amount-icon" aria-hidden="true"><use href="#kk-gem"/></svg></span>`;
        }

        const icon = name => `<svg class="kk-icon" aria-hidden="true"><use href="#kk-${name}"/></svg>`;

        function getTotalGems() {
            return pack.reduce((sum, qty, i) => sum + qty * items[i].gems, 0);
        }

        function getValueLevel(pct) {
            return valueLevels.find(level => level.min === null || pct >= level.min);
        }

        function valueLevelText(level) {
            return level.min === null ? t('belowTen') : `${level.min}%+`;
        }

        /* ═══════════════════════════════════
           RENDER
           ═══════════════════════════════════ */
        function renderUI() {
            document.documentElement.lang = lang;
            document.title = `${t('title')} · KLAWKLA`;
            document.getElementById('title').textContent = t('title');
            document.getElementById('pack-title').textContent = t('yourPack');
            document.getElementById('catalog-title').textContent = t('itemCatalog');
            document.getElementById('label-total-gems').textContent = t('totalGems');
            document.getElementById('label-original-price').textContent = t('originalPrice');
            document.getElementById('label-sale-price').textContent = t('salePrice');
            document.getElementById('price-suffix').textContent = t('currency');
            document.getElementById('btn-clear').textContent = t('clearAll');
            document.getElementById('credit').textContent = t('credit');
            document.getElementById('store-label').textContent = t('store');
            document.getElementById('store-btn').href = t('storeUrl');
            document.querySelectorAll('#lang-toggle [data-lang]').forEach(btn => {
                btn.setAttribute('aria-pressed', String(btn.dataset.lang === lang));
            });
            renderInfoContent();
        }

        function renderInfoContent() {
            const infoToggle = document.getElementById('info-toggle');
            infoToggle.setAttribute('aria-label', t('infoLabel'));
            infoToggle.title = t('infoLabel');
            document.getElementById('info-close').setAttribute('aria-label', t('infoClose'));
            document.getElementById('info-kicker').textContent = t('infoKicker');
            document.getElementById('info-title').textContent = t('infoTitle');
            document.getElementById('info-steps').innerHTML = t('infoSteps')
                .map(step => `<li>${step}</li>`)
                .join('');
            document.getElementById('info-result-note').textContent = t('infoResultNote');
            document.getElementById('gem-rate-title').textContent = t('gemRateTitle');
            document.getElementById('gem-rate-list').innerHTML = gemPacks
                .map(rate => `<div class="pv-rate">${gemAmount(rate.gems)}<strong>${fmt(rate.thb)}${NBSP}${t('currency')}</strong></div>`)
                .join('');
            document.getElementById('value-rate-title').textContent = t('valueRateTitle');
            document.getElementById('value-rate-list').innerHTML = valueLevels
                .map(level => `<div class="pv-tier"><span class="pv-tier-min">${valueLevelText(level)}</span><span ${TIER_TAG[level.key]}>${t(level.key)}</span></div>`)
                .join('');
        }

        function render() {
            renderUI();
            renderPack();
            renderCatalog();
            updateResult();
        }

        function renderPack() {
            const listEl = document.getElementById('pack-list');
            const totalEl = document.getElementById('pack-total');
            const countEl = document.getElementById('pack-count');
            const units = pack.reduce((sum, qty) => sum + qty, 0);

            if (units === 0) {
                listEl.innerHTML = `<div class="kk-empty"><p class="kk-empty-hint">${t('emptyPack')}</p></div>`;
                totalEl.hidden = true;
                countEl.textContent = '';
                return;
            }

            let html = '';
            for (let i = 0; i < items.length; i++) {
                if (pack[i] === 0) continue;
                html += `<div class="kk-row">
                    <span class="kk-row-icon"><img src="images/${items[i].img}" alt="" width="40" height="40" loading="lazy"></span>
                    <div class="kk-row-body">
                        <p class="kk-row-title">${itemName(items[i])} &times;${NBSP}${pack[i]}</p>
                        <p class="kk-row-meta">${gemAmount(items[i].gems * pack[i])}</p>
                    </div>
                    <div class="kk-row-end">
                        <button class="kk-iconbtn kk-iconbtn--sm" type="button" data-remove="${i}" aria-label="${t('remove')} ${itemName(items[i])}">${icon('close')}</button>
                    </div>
                </div>`;
            }

            const totalGems = getTotalGems();
            listEl.innerHTML = html;
            totalEl.hidden = false;
            countEl.textContent = t('count')(units);
            document.getElementById('total-gems').innerHTML = `${fmt(totalGems)}<span class="kk-sr"> ${t('gems')}</span><svg class="kk-amount-icon" aria-hidden="true"><use href="#kk-gem"/></svg>`;
            document.getElementById('total-thb').textContent = `${fmt(gemsToTHB(totalGems))}${NBSP}${t('currency')}`;
        }

        function catalogRow(i) {
            const qty = pack[i];
            const name = itemName(items[i]);
            return `<div class="kk-row kk-row--tile${qty > 0 ? ' is-selected' : ''}" data-row="${i}">
                <span class="kk-row-icon"><img src="images/${items[i].img}" alt="" width="40" height="40" loading="lazy"></span>
                <div class="kk-row-body">
                    <p class="kk-row-title">${name}</p>
                    <p class="kk-row-meta">${gemAmount(items[i].gems)}</p>
                </div>
                <div class="kk-row-end">
                    <div class="kk-stepper kk-stepper--sm">
                        <button class="kk-stepper-key" type="button" data-sub="${i}" aria-label="${t('decrease')} ${name}"${qty === 0 ? ' disabled' : ''}>${icon('minus')}</button>
                        <input class="kk-stepper-input${qty === 0 ? ' is-zero' : ''}" type="number" id="qty-${i}" value="${qty}" min="0" inputmode="numeric" data-qty="${i}" aria-label="${t('quantity')} ${name}">
                        <button class="kk-stepper-key" type="button" data-add="${i}" aria-label="${t('increase')} ${name}">${icon('plus')}</button>
                    </div>
                </div>
            </div>`;
        }

        function renderCatalog() {
            let html = '';
            for (const cat of categories) {
                const rows = items.map((item, i) => item.cat === cat.key ? catalogRow(i) : '').join('');
                html += `<div class="pv-group">
                    <h3 class="kk-eyebrow kk-row-group">${t('categories')[cat.key]}</h3>
                    <div class="kk-rows kk-rows--tiles">${rows}</div>
                </div>`;
            }
            document.getElementById('catalog').innerHTML = html;
        }

        /* Update one catalog row in place, so focus and scroll stay put */
        function syncRow(i) {
            const row = document.querySelector(`[data-row="${i}"]`);
            if (!row) return;
            const qty = pack[i];
            row.classList.toggle('is-selected', qty > 0);
            const input = row.querySelector('[data-qty]');
            if (document.activeElement !== input) input.value = qty;
            input.classList.toggle('is-zero', qty === 0);
            const subBtn = row.querySelector('[data-sub]');
            if (qty === 0 && document.activeElement === subBtn) row.querySelector('[data-add]').focus();
            subBtn.disabled = qty === 0;
        }

        /* ═══════════════════════════════════
           LIVE RESULT
           ═══════════════════════════════════ */
        function updateResult() {
            const resultEl = document.getElementById('result');
            const totalGems = getTotalGems();

            if (totalGems === 0) {
                resultEl.innerHTML = `<p class="pv-hint">${t('hintNoItems')}</p>`;
                return;
            }

            const rawPrice = document.getElementById('sale-price').value;
            const salePrice = parseFloat(rawPrice);
            if (rawPrice === '' || isNaN(salePrice) || salePrice < 0) {
                resultEl.innerHTML = `<p class="pv-hint">${t('hintNoPrice')}</p>`;
                return;
            }

            const originalTHB = gemsToTHB(totalGems);
            const savings = originalTHB - salePrice;
            const pct = Math.round(originalTHB > 0 ? (savings / originalTHB) * 100 : 0);
            const level = getValueLevel(pct);
            const sign = pct > 0 ? '+' : pct < 0 ? '−' : '';
            const meter = Math.min(100, Math.abs(pct));
            const note = savings >= 0
                ? t('noteSave')(fmt(savings), fmt(originalTHB))
                : t('noteOver')(fmt(Math.abs(savings)), fmt(originalTHB));
            const ticks = [10, 25, 40, 60, 80].map(v => `<i class="kk-meter-tick" style="left:${v}%"></i>`).join('');

            resultEl.innerHTML = `<div class="kk-deal" data-tier="${level.key}" style="--pct:${meter}%">
                <span class="kk-deal-pct">${sign}${Math.abs(pct)}%</span>
                <span class="kk-tag">${t(level.key)}</span>
                <span class="kk-deal-note">${note}</span>
                <div class="kk-meter" aria-hidden="true"><i class="kk-meter-fill"></i>${ticks}</div>
            </div>`;
        }

        /* ═══════════════════════════════════
           INFO DIALOG
           ═══════════════════════════════════ */
        const infoModal = document.getElementById('info-modal');
        const infoScrim = document.getElementById('info-scrim');
        const infoToggle = document.getElementById('info-toggle');

        function setInfoModal(open) {
            infoModal.hidden = !open;
            infoScrim.hidden = !open;
            infoToggle.setAttribute('aria-expanded', String(open));
            (open ? document.getElementById('info-close') : infoToggle).focus();
        }

        /* ═══════════════════════════════════
           EVENT HANDLERS
           ═══════════════════════════════════ */
        const catalogEl = document.getElementById('catalog');

        catalogEl.addEventListener('click', (e) => {
            const addBtn = e.target.closest('[data-add]');
            const subBtn = e.target.closest('[data-sub]');
            const btn = addBtn || subBtn;
            if (!btn) return;
            const idx = parseInt(btn.dataset.add ?? btn.dataset.sub, 10);
            pack[idx] = addBtn ? pack[idx] + 1 : Math.max(0, pack[idx] - 1);
            syncRow(idx);
            renderPack();
            updateResult();
        });

        catalogEl.addEventListener('input', (e) => {
            const qtyInput = e.target.closest('[data-qty]');
            if (!qtyInput) return;
            const idx = parseInt(qtyInput.dataset.qty, 10);
            const val = parseInt(qtyInput.value, 10);
            pack[idx] = isNaN(val) || val < 0 ? 0 : val;
            syncRow(idx);
            renderPack();
            updateResult();
        });

        catalogEl.addEventListener('focusin', (e) => {
            if (e.target.matches('[data-qty]')) e.target.select();
        });

        catalogEl.addEventListener('focusout', (e) => {
            if (e.target.matches('[data-qty]')) e.target.value = pack[parseInt(e.target.dataset.qty, 10)];
        });

        document.getElementById('pack-list').addEventListener('click', (e) => {
            const removeBtn = e.target.closest('[data-remove]');
            if (!removeBtn) return;
            const idx = parseInt(removeBtn.dataset.remove, 10);
            pack[idx] = 0;
            syncRow(idx);
            renderPack();
            updateResult();
        });

        infoToggle.addEventListener('click', () => setInfoModal(true));

        document.addEventListener('click', (e) => {
            if (!infoModal.hidden && e.target.closest('[data-info-close]')) setInfoModal(false);
        });

        document.addEventListener('keydown', (e) => {
            if (infoModal.hidden) return;
            if (e.key === 'Escape') {
                setInfoModal(false);
            } else if (e.key === 'Tab') {
                /* keep focus inside the dialog */
                const focusables = infoModal.querySelectorAll('button, a[href], input');
                const first = focusables[0];
                const last = focusables[focusables.length - 1];
                if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
                else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
            }
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            pack.fill(0);
            document.getElementById('sale-price').value = '';
            render();
        });

        document.getElementById('sale-price').addEventListener('input', updateResult);

        document.getElementById('lang-toggle').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-lang]');
            if (!btn || btn.dataset.lang === lang) return;
            lang = btn.dataset.lang;
            render();
        });

        /* Init */
        render();
    </script>
</body>
</html>
